# Merges the Dependabot groups CI can prove (minor-and-patch, actions) once the
# PR gate is green. Vercel deploys main by itself, so no main workflow is started.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Pull request]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: Merge
    uses: kaycabral/toolkit/.github/workflows/dependabot-auto-merge.yml@0dd0a4fa17c44d7ac401f8cc96bd0c4615cb56c1 # main
    with:
      main-workflow: ''
    permissions:
      contents: write
      pull-requests: write
      actions: write
