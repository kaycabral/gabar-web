packages:
  - apps/*
  - packages/*

# Supply-chain quarantine (minutes): resolution never picks a version published
# less than 3 days ago, the window in which compromised releases get yanked.
# Same rule as Dependabot's cooldown; our own @cbrl packages are exempt.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@cbrl/*'

# Single source of truth for shared dependency versions. Bump = edit here +
# `pnpm install`. Deps used by a single workspace stay inline in its package.json.
catalog:
  react: ^19.2.6
  react-dom: ^19.2.6
  next-themes: ^0.4.6
  typescript: ~6.0.3
  '@types/node': ^26.6.6
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  tailwindcss: ^4.3.0
  '@tailwindcss/postcss': ^4.3.0
  '@tailwindcss/typography': ^0.5.19
  clsx: ^2.1.1
  radix-ui: ^1.4.3
  lucide-react: ^1.77.0
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  vitest: ^5.1.0
  '@vitest/coverage-v8': ^5.1.0
  '@vitejs/plugin-react': ^6.0.2
  '@playwright/test': ^1.59.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.13
  jsdom: ^31.0.1
  tsx: ^4.21.0
  drizzle-orm: ~0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.22.0
  '@types/pg': ^8.20.0
